<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>SKILLITE AI Mentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #080c14;
            --bg-header: rgba(10,16,28,0.97);
            --bg-input:  #0e1624;
            --bg-ai:     #111c32;
            --accent:    #22c55e;
            --accent-dk: #16a34a;
            --accent-gl: rgba(34,197,94,0.28);
            --text:      #e2e8f4;
            --muted:     #3a4e66;
            --border:    rgba(255,255,255,0.07);
            --font-d: 'Syne', sans-serif;
            --font-b: 'DM Sans', sans-serif;
            --header-h: 58px;
        }

        html, body { height: 100%; margin: 0; padding: 0; }

        body {
            font-family: var(--font-b);
            background: var(--bg);
            color: var(--text);
            /* position:fixed = the real WhatsApp trick */
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(ellipse 55% 35% at 15% 8%,  rgba(34,197,94,0.07) 0%, transparent 70%),
                radial-gradient(ellipse 45% 50% at 85% 92%, rgba(56,189,248,0.05) 0%, transparent 65%);
        }

        /* HEADER — fixed top */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--header-h);
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: var(--bg-header);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
        }

        .brand { display: flex; align-items: center; gap: 10px; }
        .logo {
            width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent-dk));
            display: flex; align-items: center; justify-content: center;
            font-size: 17px;
            box-shadow: 0 0 14px var(--accent-gl);
        }
        .brand-name {
            font-family: var(--font-d); font-weight: 800;
            font-size: clamp(14px, 4vw, 17px); letter-spacing: -0.02em;
        }
        .brand-name span { color: var(--accent); }
        .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #7a8ba8; }
        .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent); box-shadow: 0 0 7px var(--accent);
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink {
            0%,100% { opacity:1; transform:scale(1); }
            50%      { opacity:.5; transform:scale(.75); }
        }

        /* INPUT BAR — fixed bottom */
        #input-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 30;
            background: var(--bg-header);
            border-top: 1px solid var(--border);
            padding: 9px 12px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }

        .input-row { display: flex; align-items: flex-end; gap: 8px; }

        #message {
            flex: 1;
            min-height: 42px;
            max-height: 130px;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1.5px solid rgba(255,255,255,.09);
            border-radius: 22px;
            color: var(--text);
            font-family: var(--font-b);
            font-size: clamp(14px, 3.8vw, 15px);
            line-height: 1.45;
            outline: none;
            resize: none;
            overflow-y: auto;
            caret-color: var(--accent);
            transition: border-color .18s, box-shadow .18s;
            scrollbar-width: none;
        }
        #message::-webkit-scrollbar { display: none; }
        #message::placeholder { color: var(--muted); }
        #message:focus {
            border-color: rgba(34,197,94,.42);
            box-shadow: 0 0 0 3px rgba(34,197,94,.07);
        }

        #send-btn {
            width: 42px; height: 42px; flex-shrink: 0;
            border-radius: 50%;
            background: var(--accent);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform .14s, background .14s;
            box-shadow: 0 4px 14px var(--accent-gl);
            align-self: flex-end;
        }
        #send-btn:hover  { background: var(--accent-dk); transform: scale(1.08); }
        #send-btn:active { transform: scale(.91); }
        #send-btn:disabled { opacity:.35; cursor:not-allowed; transform:none; background:var(--muted); box-shadow:none; }
        #send-btn svg {
            width:18px; height:18px; fill:none; stroke:#fff;
            stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;
            transform:translateX(1px);
        }

        .hint {
            text-align: center; font-size: 10.5px;
            color: var(--muted); margin-top: 6px; letter-spacing:.02em;
        }
        .hint kbd {
            background: rgba(255,255,255,.07);
            padding: 1px 5px; border-radius: 4px;
            font-size: 10px; font-family: inherit;
        }

        /* CHAT — fills space between fixed header and fixed input */
        #chat {
            position: fixed;
            left: 0; right: 0;
            top: var(--header-h);
            /* bottom will be set by JS after input-bar height is known */
            bottom: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            display: flex;
            flex-direction: column;
            padding: 14px 13px 14px;
            gap: 3px;
            z-index: 1;
            scroll-behavior: smooth;
        }
        #chat::-webkit-scrollbar { width: 3px; }
        #chat::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }

        .date-chip {
            align-self: center;
            font-size: 10.5px; font-weight: 500; letter-spacing:.07em; text-transform:uppercase;
            color: var(--muted);
            background: rgba(255,255,255,.04);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 12px;
            margin: 6px 0 10px;
        }

        .row {
            display: flex; align-items: flex-end; gap: 7px;
            animation: pop .22s cubic-bezier(.34,1.56,.64,1) both;
        }
        .row.user { flex-direction: row-reverse; }
        .row.ai   { flex-direction: row; }

        @keyframes pop {
            from { opacity:0; transform:translateY(10px) scale(.95); }
            to   { opacity:1; transform:none; }
        }

        .av {
            width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; margin-bottom: 1px;
        }
        .av.ai-av   { background: linear-gradient(135deg,#1d4ed8,#22c55e); box-shadow:0 0 10px rgba(34,197,94,.2); }
        .av.user-av { background: linear-gradient(135deg,#22c55e,#16a34a); }

        .bubble {
            max-width: min(76%, 460px);
            padding: 10px 14px;
            border-radius: 18px;
            font-size: clamp(13.5px, 3.8vw, 15px);
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .bubble.user {
            background: var(--accent); color: #041a0a; font-weight: 500;
            border-bottom-right-radius: 4px;
            box-shadow: 0 3px 16px rgba(34,197,94,.18);
        }
        .bubble.ai {
            background: var(--bg-ai); color: var(--text);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,.07);
            box-shadow: 0 3px 16px rgba(0,0,0,.28);
        }

        .typing {
            background: var(--bg-ai);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 18px; border-bottom-left-radius: 4px;
            padding: 12px 16px;
            display: flex; align-items: center; gap: 5px;
        }
        .typing span {
            width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
            animation: bounce 1.2s ease-in-out infinite;
        }
        .typing span:nth-child(2) { animation-delay:.2s; }
        .typing span:nth-child(3) { animation-delay:.4s; }
        @keyframes bounce {
            0%,80%,100% { transform:translateY(0); opacity:.35; }
            40%          { transform:translateY(-6px); opacity:1; }
        }

        /* desktop centering */
        @media (min-width: 900px) {
            body { display: flex; justify-content: center; background: #04070f; }
            header, #input-bar, #chat {
                max-width: 760px;
                left: 50%; transform: translateX(-50%);
            }
            header, #input-bar {
                box-shadow: 0 0 0 1px rgba(255,255,255,.05);
            }
            .bubble { max-width: min(68%, 500px); font-size: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo">🚀</div>
            <div class="brand-name">SKILLITE <span>AI</span></div>
        </div>
        <div class="status">
            <div class="dot"></div>
            Career Mentor
        </div>
    </header>

    <div id="chat">
        <div class="date-chip">Today</div>
    </div>

    <div id="input-bar">
        <div class="input-row">
            <textarea id="message" rows="1"
                placeholder="Message…"
                autocomplete="off" autocorrect="off"
                autocapitalize="sentences" spellcheck="false"></textarea>
            <button id="send-btn" onclick="sendMessage()" title="Send">
                <svg viewBox="0 0 24 24">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>
        <div class="hint">
            <kbd>Enter</kbd> send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> new line
        </div>
    </div>

<script>
    let sid = localStorage.getItem("sid") || Date.now().toString();
    localStorage.setItem("sid", sid);

    let busy = false;
    const chat  = document.getElementById("chat");
    const input = document.getElementById("message");
    const btn   = document.getElementById("send-btn");
    const bar   = document.getElementById("input-bar");

    // Key fix: set chat's bottom = input-bar height, so chat never goes under it
    function fitChat() {
        const barH = bar.getBoundingClientRect().height;
        chat.style.bottom = barH + "px";
    }

    function scrollBottom() {
        requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
    }

    function addMessage(text, type) {
        const row = document.createElement("div");
        row.className = "row " + type;
        const av = document.createElement("div");
        av.className = "av " + (type === "ai" ? "ai-av" : "user-av");
        av.textContent = type === "ai" ? "✦" : "👤";
        const bub = document.createElement("div");
        bub.className = "bubble " + type;
        bub.textContent = text;
        type === "ai" ? row.append(av, bub) : row.append(bub, av);
        chat.appendChild(row);
        scrollBottom();
    }

    function showTyping() {
        const row = document.createElement("div");
        row.className = "row ai"; row.id = "typing";
        const av = document.createElement("div");
        av.className = "av ai-av"; av.textContent = "✦";
        const t = document.createElement("div");
        t.className = "typing";
        t.innerHTML = "<span></span><span></span><span></span>";
        row.append(av, t);
        chat.appendChild(row);
        scrollBottom();
    }

    function hideTyping() { document.getElementById("typing")?.remove(); }

    async function sendMessage(init = null) {
        if (busy) return;
        const msg = init ?? input.value.trim();
        if (!msg) return;

        if (!init) {
            addMessage(msg, "user");
            input.value = "";
            input.style.height = "auto";
            fitChat();
        }

        busy = true; btn.disabled = true;
        showTyping();

        try {
            const res  = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: msg, session_id: sid })
            });
            const data = await res.json();
            hideTyping();
            addMessage(data.reply, "ai");
        } catch {
            hideTyping();
            addMessage("Something went wrong. Please try again.", "ai");
        }

        busy = false; btn.disabled = false;
        input.focus();
    }

    // textarea auto-grow + refit chat bottom
    input.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 130) + "px";
        fitChat();
        scrollBottom();
    });

    // Enter = send, Shift+Enter = newline
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // refit on resize (keyboard open/close on mobile)
    window.addEventListener("resize", () => { fitChat(); scrollBottom(); });
    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", () => { fitChat(); scrollBottom(); });
    }

    // init
    window.addEventListener("load", () => {
        fitChat();
        sendMessage("hi");
    });
</script>
</body>
</html>
